; ==============================================================================
; ArcSim_VR - PlatformIO Configuration File
; Sistema de Soldadura SMAW para Capacitación de Operarios
; ==============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags = 
    -D CORE_DEBUG_LEVEL=2
    -D CONFIG_FREERTOS_HZ=1000

lib_deps = 
    bblanchon/ArduinoJson @ ^6.21.3
    electroniccats/MPU6050 @ ^1.3.1
