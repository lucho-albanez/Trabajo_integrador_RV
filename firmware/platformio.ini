; ==============================================================================
; ArcSim_VR - PlatformIO Configuration File
; Entorno de desarrollo para ESP32 DevKit v1
; ==============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags = 
    -D CONFIG_FREERTOS_HZ=1000

lib_deps = 
    pololu/VL53L1X @ ^1.3.1
